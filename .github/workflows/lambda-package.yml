name: Lambda Package

on:
  workflow_dispatch:
  push:
    paths:
      - "common-lambda/email-lambda-v2kmedia/**"
      - ".github/workflows/lambda-package.yml"

env:
  NODE_VERSION: "20"

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common-lambda/email-lambda-v2kmedia
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "common-lambda/email-lambda-v2kmedia/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda ZIP
        run: npm run package

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: common-lambda/email-lambda-v2kmedia/lambda-package.zip
          retention-days: 7
