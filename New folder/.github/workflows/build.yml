name: Build Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with default swatch (deep-blue)
        run: npm run build

      - name: Build with teal swatch
        run: SELECTED_SWATCH=teal npm run build
        env:
          VITE_CONTACT_API_URL: ""

      - name: Build with emerald swatch
        run: SELECTED_SWATCH=emerald npm run build
        env:
          VITE_CONTACT_API_URL: ""

      - name: Build with amber swatch
        run: SELECTED_SWATCH=amber npm run build
        env:
          VITE_CONTACT_API_URL: ""

      - name: Create zip archive
        run: |
          cd dist
          zip -r ../v2kmedia.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2kmedia
          path: v2kmedia.zip
